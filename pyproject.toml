[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "java-bridge"
version = "0.1.0"
description = "Ghidra-bridge-protocol backend for Dryxio/reagent: reconstruct Java methods from .class/.jar files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
reagent = ["auto-re-agent>=0.4.0"]
dev = ["pytest>=8.0", "auto-re-agent>=0.4.0"]

[project.scripts]
java-bridge = "java_bridge.cli:main"
reagent-java = "reagent_java:main"

[tool.hatch.build.targets.wheel]
packages = ["java_bridge", "reagent_java"]

[tool.pytest.ini_options]
testpaths = ["tests"]
